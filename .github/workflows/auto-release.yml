name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "homeassistant/config.yaml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version sync
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          ADDON_VERSION=$(grep '^version:' homeassistant/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "$ADDON_VERSION" ]; then
            echo "Cargo.toml version ($CARGO_VERSION) does not match homeassistant/config.yaml ($ADDON_VERSION)" >&2
            exit 1
          fi

      - name: Extract version from config
        id: version
        run: |
          VERSION=$(grep '^version:' homeassistant/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git tag -l "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and push
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Cleanup old releases
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=3
          RELEASES=$(gh release list --repo MarkBovee/nebu-ctx --limit 50 --json tagName,isDraft,isPrerelease -q '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' 2>/dev/null || true)
          COUNT=0
          while IFS= read -r tag; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo MarkBovee/nebu-ctx --yes || true
              git push origin ":refs/tags/$tag" 2>/dev/null || true
            fi
          done <<< "$RELEASES"
