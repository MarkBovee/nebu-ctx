name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.2)"
        required: true

env:
  CARGO_BUILD_JOBS: 2
  CLIENT_MANIFEST_PATH: client/Cargo.toml
  CLIENT_BINARY_NAME: nebu-ctx

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            container: rust:1.95-slim-bookworm
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Bookworm container)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.container == ''
        run: cargo install cross --locked

      - name: Build (native in Bookworm)
        if: matrix.container != ''
        run: cargo build --release --manifest-path ${{ env.CLIENT_MANIFEST_PATH }} --bin ${{ env.CLIENT_BINARY_NAME }}

      - name: Build (cross for arm64)
        if: matrix.container == ''
        run: cross build --release --manifest-path ${{ env.CLIENT_MANIFEST_PATH }} --bin ${{ env.CLIENT_BINARY_NAME }} --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebu-ctx-${{ matrix.arch }}
          path: ${{ matrix.container != '' && format('client/target/release/{0}', env.CLIENT_BINARY_NAME) || format('client/target/{0}/release/{1}', matrix.target, env.CLIENT_BINARY_NAME) }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries with arch suffix
        run: |
          mv artifacts/nebu-ctx-amd64/${{ env.CLIENT_BINARY_NAME }} artifacts/nebu-ctx-amd64/nebu-ctx-amd64
          mv artifacts/nebu-ctx-arm64/${{ env.CLIENT_BINARY_NAME }} artifacts/nebu-ctx-arm64/nebu-ctx-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/nebu-ctx-amd64/nebu-ctx-amd64
            artifacts/nebu-ctx-arm64/nebu-ctx-arm64
          body: |
            Pre-built thin client binaries for nebu-ctx ${{ steps.version.outputs.tag }}

            These binaries connect to the .NET nebu-ctx server and dashboard runtime.

            | Arch | Binary |
            |------|--------|
            | amd64 | `nebu-ctx-amd64` |
            | arm64 | `nebu-ctx-arm64` |

  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path client/Cargo.toml --locked

  publish-server-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/markbovee/nebu-ctx:${{ steps.version.outputs.version }}
            ghcr.io/markbovee/nebu-ctx:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
