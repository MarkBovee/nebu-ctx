[package]
name = "nebu-ctx"
version = "0.2.7"
edition = "2021"
description = "Thin Rust client for the .NET nebu-ctx MCP and dashboard server."
license = "Apache-2.0"
homepage = "https://nebu-ctx.com"
repository = "https://github.com/MarkBovee/nebu-ctx"
documentation = "https://docs.rs/nebu-ctx"
readme = "README.md"
keywords = ["mcp", "client", "context", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nebu-ctx"
path = "src/main.rs"

[[bin]]
name = "nebula-ctx"
path = "src/bin/nebula-ctx.rs"

[[bin]]
name = "nebu-ctx-client"
path = "src/bin/nebu-ctx-client.rs"

[lib]
name = "nebu_ctx_client"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "5"
ignore = "0.4"
regex = "1"
rpassword = "7.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"