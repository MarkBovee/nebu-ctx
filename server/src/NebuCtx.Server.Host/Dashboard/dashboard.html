}

async function loadAgents() {
  const container = $('view-agents');
  try {
    const data = await apiFetch('/api/agents');
    const agents = data.agents || [];
    container.innerHTML = `
      <div class="row r3" style="margin-bottom:16px">
        <div class="hc"><div class="hv" style="color:var(--green);font-size:24px">${data.total_active || 0}</div><div class="hl">Active Agents</div></div>
        <div class="hc"><div class="hv" style="color:var(--purple);font-size:24px">${data.pending_messages || 0}</div><div class="hl">Pending Messages</div></div>
        <div class="hc"><div class="hv" style="color:var(--blue);font-size:24px">${data.shared_contexts || 0}</div><div class="hl">Shared Contexts</div></div>
      </div>
      <div id="agentTimeline"></div>
      ${howItWorks('Multi-Agent Coordination', 'Nebu-CTX supports <strong>multi-agent</strong> workflows where multiple AI coding assistants can work concurrently. Agents register themselves and share context through a <strong>scratchpad</strong> mechanism. Each agent has a <strong>type</strong> (parent, child, specialist), a <strong>role</strong> description, and a <strong>status</strong>. The system coordinates context sharing via <code>ctx_share</code> and task handoff via <code>ctx_agent(action=handoff)</code>.')}`;

    const timeline = $('agentTimeline');
    if (!agents.length) {
      timeline.innerHTML = '<div class="empty-state" style="padding:40px"><h2>No active agents</h2><p>Agents appear here when multi-agent workflows are running.</p></div>';
    } else {
      const sorted = [...agents].sort((a, b) => (a.last_active_minutes_ago ?? 9999) - (b.last_active_minutes_ago ?? 9999));
      const activeAgents = sorted.filter(a => (a.last_active_minutes_ago ?? 9999) <= 30);
      const staleAgents = sorted.filter(a => (a.last_active_minutes_ago ?? 9999) > 30);
      const renderAgent = (a, dimmed) => {
        const st = (a.status || '').toLowerCase();
        const statusColor = st === 'active' ? 'active' : st === 'idle' ? 'idle' : 'offline';
        const mins = a.last_active_minutes_ago;
        const timeStr = mins == null ? '' : mins < 1 ? 'just now' : mins < 60 ? mins + 'm ago' : Math.round(mins/60) + 'h ago';
        const timeColor = mins == null ? 'var(--muted)' : mins < 5 ? 'var(--green)' : mins < 30 ? 'var(--yellow)' : 'var(--muted)';
        return `<div class="swimlane" style="${dimmed ? 'opacity:0.45' : ''}">
          <div class="agent-dot ${statusColor}"></div>
          <div class="agent-info">
            <div class="agent-name">${esc(a.id)}${a.role ? ' <span style="font-size:10px;color:var(--muted);font-weight:400">· ' + esc(a.role) + '</span>' : ''}</div>
            <div class="agent-meta">${esc(a.type || '')} &middot; ${esc(a.status || '')}${a.status_message ? ' &middot; ' + esc(a.status_message) : ''}</div>
          </div>
          <div style="font-size:11px;font-family:var(--mono);color:${timeColor};font-weight:600;white-space:nowrap">${timeStr}</div>
        </div>`;
      };
      timeline.innerHTML = activeAgents.map(a => renderAgent(a, false)).join('')
        + (staleAgents.length ? `<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 6px;padding:0 4px">Inactive (>30m)</div>` + staleAgents.map(a => renderAgent(a, true)).join('') : '');
    }
  } catch (e) { showError(container, 'Could not load agent data.'); }
}

async function loadBugs() {
  const container = $('view-bugs');
  try {
    const data = await apiFetch('/api/gotchas');
    const gotchas = data.gotchas || [];
    const stats = data.stats || {};

    container.innerHTML = `
      <div class="row r4" style="margin-bottom:16px">
        <div class="hc"><div class="hv" style="color:var(--blue);font-size:24px">${stats.total_errors_detected || 0}</div><div class="hl">Total Detected</div></div>
        <div class="hc"><div class="hv" style="color:var(--green);font-size:24px">${stats.total_prevented || 0}</div><div class="hl">Prevented</div></div>
        <div class="hc"><div class="hv" style="color:var(--purple);font-size:24px">${gotchas.length}</div><div class="hl">Active Gotchas</div></div>
        <div class="hc"><div class="hv" style="color:var(--yellow);font-size:24px">${stats.total_fixes_correlated || 0}</div><div class="hl">Fixes Correlated</div></div>
      </div>
      <div class="card">
        <h3>Gotcha Patterns</h3>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Severity</th><th>Category</th><th>Trigger</th><th>Resolution</th><th class="r">Seen</th><th class="r">Confidence</th><th class="r">Prevented</th></tr></thead>
          <tbody id="bugsTable"></tbody>
        </table>
        </div>
      </div>
      ${howItWorks('Bug Memory (Gotcha Tracker)', 'Nebu-CTX automatically detects <strong>error patterns</strong> by monitoring compiler/linter output. When the same error is seen multiple times, it becomes a <strong>gotcha</strong> with a trigger pattern and resolution. The system tracks <strong>confidence</strong> based on how often the pattern-fix correlation holds. When a known gotcha is about to recur, Nebu-CTX can <strong>prevent</strong> it by injecting the fix into context before the error happens.')}`;

    const tb = $('bugsTable');
    if (!gotchas.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">No gotchas detected yet</td></tr>'; return; }
    tb.innerHTML = gotchas.slice(0, 30).map(g => {
      const sevClass = g.severity === 'Critical' ? 'severity-critical' : g.severity === 'Warning' ? 'severity-warning' : 'severity-info';
      const conf = Math.round((g.confidence || 0) * 100);
      return `<tr>
        <td><span class="${sevClass}" style="font-weight:600">${esc(g.severity || 'Info')}</span></td>
        <td>${esc((g.category || '').toLowerCase())}</td>
        <td style="max-width:280px;font-size:12px;word-break:break-word;white-space:normal">${esc(g.trigger)}</td>
        <td style="max-width:280px;font-size:12px;word-break:break-word;white-space:normal;color:var(--muted)">${esc(g.resolution)}</td>
        <td class="r">${g.occurrences || 1}x</td>
        <td class="r"><span class="tag ${conf >= 70 ? 'tg' : conf >= 40 ? 'ty' : 'td'}">${conf}%</span></td>
        <td class="r">${g.prevented_count || 0}</td>
      </tr>`;
    }).join('');
  } catch (e) { showError(container, 'Could not load bug memory data.'); }
}

async function deleteBrainEntry(projectId, key) {
  if (!confirm(`Delete memory "${key}"?`)) return;
  try {
    await apiFetch(`/api/dashboard/projects/${encodeURIComponent(projectId)}/memory/brain/${encodeURIComponent(key)}`, { method: 'DELETE' });
    loadBrain();
  } catch (e) { alert('Failed to delete entry.'); }
}

async function loadDomainNav() {
  try {
    const res = await fetch(resolveDashboardUrl('/api/dashboard/domains'));
    if (!res.ok) return;
    const payload = await res.json();
    if (!payload || !Array.isArray(payload.domains) || !payload.domains.length) return;

    const normalized = payload.domains
      .map(domain => ({
        id: String(domain.id || ''),
        label: String(domain.label || domain.id || ''),
        description: String(domain.description || ''),
        views: Array.isArray(domain.views)
          ? domain.views.map(view => String(view.id || '')).filter(Boolean)
          : [],
      }))
      .filter(domain => domain.views.length > 0);

    if (normalized.length) domainNav = normalized;
  } catch {}
}

async function clearBrainProject(projectId, name) {
  if (!confirm(`Clear all memories for "${name}"? This cannot be undone.`)) return;
  try {
    await apiFetch(`/api/dashboard/projects/${encodeURIComponent(projectId)}/memory/brain`, { method: 'DELETE' });
    loadBrain();
  } catch (e) { alert('Failed to clear project memories.'); }
}

async function deleteKnowledgeFact(projectId, category, key) {
  if (!confirm(`Delete knowledge fact "${key}"?`)) return;
  try {
    await apiFetch(`/api/dashboard/projects/${encodeURIComponent(projectId)}/memory/knowledge/${encodeURIComponent(category)}/${encodeURIComponent(key)}`, { method: 'DELETE' });
    const select = $('memoryProjectSelect');
    await loadProjectMemory(select ? select.value : projectId);
  } catch (e) { alert('Failed to delete knowledge fact.'); }
}

async function clearKnowledgeProject(projectId, name) {
  if (!confirm(`Clear all knowledge facts for "${name}"? This cannot be undone.`)) return;
  try {
    await apiFetch(`/api/dashboard/projects/${encodeURIComponent(projectId)}/memory/knowledge`, { method: 'DELETE' });
    await loadProjectMemory(projectId);
  } catch (e) { alert('Failed to clear project knowledge.'); }
}

async function loadProjectMemory(projectId) {
  const host = $('memoryProjectDetail');
  if (!host || !projectId) return;
  host.innerHTML = '<div class="loading-state">Loading project memory...</div>';
  try {
    const payload = await apiFetch(`/api/dashboard/projects/${encodeURIComponent(projectId)}/memory`, { timeoutMs: 5000 });
    const knowledge = payload.knowledge || [];
    const brain = payload.brain || [];
    const latestKnowledge = knowledge.length ? new Date(knowledge.reduce((latest, item) => item.updated_at > latest ? item.updated_at : latest, knowledge[0].updated_at)).toLocaleString() : '—';
    const latestBrain = brain.length ? new Date(brain[0].created_at).toLocaleString() : '—';
    host.innerHTML = `
      <div class="row r4" style="margin-bottom:16px">
        <div class="hc"><div class="hv" style="color:var(--green);font-size:24px">${knowledge.length}</div><div class="hl">Project Facts</div></div>
        <div class="hc"><div class="hv" style="color:var(--purple);font-size:24px">${brain.length}</div><div class="hl">Project Memories</div></div>
        <div class="hc"><div class="hv" style="color:var(--blue);font-size:16px">${esc(latestKnowledge)}</div><div class="hl">Latest Fact</div></div>
        <div class="hc"><div class="hv" style="color:var(--yellow);font-size:16px">${esc(latestBrain)}</div><div class="hl">Latest Memory</div></div>
      </div>
      <div class="row r11">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h3 style="margin:0">Knowledge Facts</h3>
            ${knowledge.length ? `<button onclick="clearKnowledgeProject(${jsArg(payload.project_id)},${jsArg(payload.project_name)})" style="font-size:11px;color:var(--red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:6px;padding:4px 10px;cursor:pointer">Clear facts</button>` : ''}
          </div>
          ${knowledge.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Category</th><th>Key</th><th>Value</th><th class="r">Conf</th><th></th></tr></thead><tbody>${knowledge.slice(0, 100).map(f => `<tr>
            <td><span class="tag tp">${esc(f.category)}</span></td>
            <td style="font-family:var(--mono);font-size:12px;white-space:nowrap">${esc(f.key)}</td>
            <td style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(f.value)}">${esc(f.value)}</td>
            <td class="r"><span class="tag ${(f.confidence || 0) >= 0.7 ? 'tg' : 'ty'}">${Math.round((f.confidence || 0) * 100)}%</span></td>
            <td style="padding:4px 6px;width:28px"><button onclick="deleteKnowledgeFact(${jsArg(payload.project_id)},${jsArg(f.category)},${jsArg(f.key)})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px" title="Delete">×</button></td>
          </tr>`).join('')}</tbody></table></div>` : '<div class="empty-state" style="padding:32px"><h2>No facts</h2><p>No project-scoped knowledge facts stored yet.</p></div>'}
        </div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h3 style="margin:0">Brain Memories</h3>
            ${brain.length ? `<button onclick="clearBrainProject(${jsArg(payload.project_id)},${jsArg(payload.project_name)})" style="font-size:11px;color:var(--red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:6px;padding:4px 10px;cursor:pointer">Clear memories</button>` : ''}
          </div>
          ${brain.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Key</th><th>Value</th><th class="r">Stored</th><th></th></tr></thead><tbody>${brain.slice(0, 100).map(e => {
            const d = new Date(e.created_at);
            const ago = Math.round((Date.now() - d.getTime()) / 86400000);
            const dateStr = ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago + 'd ago';
            return `<tr>
              <td style="font-family:var(--mono);font-size:12px;white-space:nowrap">${esc(e.key)}</td>
              <td style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.value)}">${esc(e.value)}</td>
              <td class="r" style="font-size:11px;color:var(--muted)" title="${esc(e.created_at)}">${dateStr}</td>
              <td style="padding:4px 6px;width:28px"><button onclick="deleteBrainEntry(${jsArg(payload.project_id)},${jsArg(e.key)})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px" title="Delete">×</button></td>
            </tr>`;
          }).join('')}</tbody></table></div>` : '<div class="empty-state" style="padding:32px"><h2>No memories</h2><p>No project-scoped brain memories stored yet.</p></div>'}
        </div>
      </div>`;
  } catch (e) {
    host.innerHTML = '<div class="empty-state"><h2>Could not load project memory</h2><p>Refresh the dashboard and try again.</p></div>';
  }
}

async function loadBrain() {
  const container = $('view-brain');
  try {
    const data = await apiFetch('/api/brain');
    const entries = data.entries || [];
    const total = data.total_count || entries.length;
    const duplicateSlugGroups = (_cachedProjectList && _cachedProjectList._duplicate_slug_groups) || [];
    const duplicateFingerprintGroups = (_cachedProjectList && _cachedProjectList._duplicate_fingerprint_groups) || [];

    // Group entries by project
    const byProject = {};
    for (const e of entries) {
      const name = e.project_name || e.project_id || 'unknown';
      if (!byProject[name]) byProject[name] = [];
      byProject[name].push(e);
    }
    const projectNames = Object.keys(byProject).sort();
    const projects = await getProjectList();
    const memoryProjects = projects.length
      ? projects.map(project => {
          const rows = byProject[project.slug] || byProject[project.project_id] || [];
          return { project_id: project.project_id, project_name: project.slug || project.project_id, memory_count: rows.length };
        })
      : projectNames.map(proj => {
          const rows = byProject[proj];
          return { project_id: rows[0].project_id || '', project_name: proj, memory_count: rows.length };
        });
    const projectOptions = memoryProjects
      .filter(project => project.project_id)
      .map(project => `<option value="${esc(project.project_id)}">${esc(project.project_name)} (${project.memory_count})</option>`)
      .join('');

    container.innerHTML = `
      <div class="row r3" style="margin-bottom:16px">
        <div class="hc"><div class="hv" style="color:var(--green);font-size:24px">${total}</div><div class="hl">Total Memories</div></div>
        <div class="hc"><div class="hv" style="color:var(--purple);font-size:24px">${memoryProjects.length}</div><div class="hl">Projects</div></div>
        <div class="hc"><div class="hv" style="color:var(--blue);font-size:24px">${entries.length > 0 ? new Date(entries[0].created_at).toLocaleDateString() : '—'}</div><div class="hl">Latest Entry</div></div>
      </div>
      ${(duplicateSlugGroups.length || duplicateFingerprintGroups.length) ? `<div class="card" style="margin-bottom:16px;border-color:rgba(251,191,36,0.28);background:rgba(251,191,36,0.06)">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div>
            <h3 style="margin:0 0 8px 0;color:var(--yellow)">Project Identity Warning</h3>
            <p style="margin:0;color:var(--muted)">Duplicate project records were detected. Resolve/bind may stay unstable until these are repaired.</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${duplicateSlugGroups.length ? `<span class="tag ty">${duplicateSlugGroups.length} duplicate slug group(s)</span>` : ''}
            ${duplicateFingerprintGroups.length ? `<span class="tag ty">${duplicateFingerprintGroups.length} duplicate fingerprint group(s)</span>` : ''}
          </div>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--muted)">
          ${duplicateSlugGroups.slice(0, 6).map(group => `<div>slug <code>${esc(group.slug)}</code> -> ${group.count} projects</div>`).join('')}
          ${duplicateFingerprintGroups.slice(0, 6).map(group => `<div>fingerprint duplicate -> canonical <code>${esc(group.canonical_project_id)}</code>, ${group.count} projects</div>`).join('')}
        </div>
      </div>` : ''}
      <div class="card" style="margin-bottom:16px">
        <div class="card-header" style="margin-bottom:12px">
          <h3>Memory Admin</h3>
          ${projectOptions ? `<select id="memoryProjectSelect" class="graph-select" onchange="loadProjectMemory(this.value)">${projectOptions}</select>` : ''}
        </div>
        <div id="memoryProjectDetail">
          ${memoryProjects.length === 0 ? '<div class="empty-state" style="padding:40px"><h2>No projects found</h2><p>Run tool calls from a project to register it, then store memory with <code>ctx(domain="memory", action="store", key="...", value="...")</code>.</p></div>' : '<div class="loading-state">Select a project to inspect memory...</div>'}
        </div>
      </div>
      ${projectNames.map(proj => {
        const rows = byProject[proj];
        const projId = rows[0].project_id || '';
        return `<div class="card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h3 style="margin:0">${esc(proj)} <span class="tag tg" style="margin-left:6px">${rows.length} memories</span></h3>
            ${projId ? `<button onclick="clearBrainProject(${jsArg(projId)},${jsArg(proj)})" style="font-size:11px;color:var(--red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:6px;padding:4px 10px;cursor:pointer">Clear all</button>` : ''}
          </div>
          <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Key</th><th>Value</th><th class="r">Stored</th><th></th></tr></thead>
            <tbody>${rows.map(e => {
              const d = new Date(e.created_at);
              const ago = Math.round((Date.now() - d.getTime()) / 86400000);
              const dateStr = ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago + 'd ago';
              return `<tr>
                <td style="font-family:var(--mono);font-size:12px;white-space:nowrap">${esc(e.key)}</td>
                <td style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.value)}">${esc(e.value)}</td>
                <td class="r" style="font-size:11px;color:var(--muted)" title="${esc(e.created_at)}">${dateStr}</td>
                <td style="padding:4px 6px;width:28px">${e.project_id ? `<button onclick="deleteBrainEntry(${jsArg(e.project_id)},${jsArg(e.key)})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px" title="Delete">×</button>` : ''}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>
          </div>
        </div>`;
      }).join('')}
      ${howItWorks('Brain Memory', '<strong>ctx_brain</strong> is a persistent long-term memory store backed by Postgres. Each memory is scoped to a <strong>project</strong> and stored as a key/value pair. Use <code>ctx_brain(action="store", key="...", value="...")</code> to save facts and <code>ctx_brain(action="recall", query="...")</code> to retrieve them by semantic search. Memories survive context resets and are available across all sessions.')}`;
    if (memoryProjects.length > 0) {
      const select = $('memoryProjectSelect');
      if (select && select.value) await loadProjectMemory(select.value);
    }
  } catch (e) { showError(container, 'Could not load brain memory data.'); }
}

let _cachedProjectList = null;
async function getProjectList() {
  if (_cachedProjectList) return _cachedProjectList;
  try {
    const data = await apiFetch('/api/projects');
    _cachedProjectList = (data.projects || []);
    _cachedProjectList._duplicate_slug_groups = data.duplicate_slug_groups || [];
    _cachedProjectList._duplicate_fingerprint_groups = data.duplicate_fingerprint_groups || [];
    setTimeout(() => { _cachedProjectList = null; }, 60000); // 1 min cache TTL
    return _cachedProjectList;
  } catch { return []; }
}

function buildProjectSelectorHtml(selected, opts = {}) {
  const projects = _cachedProjectList || [];
  if (!projects.length) return `<select style="${opts.style||''}" disabled><option>— no projects —</option></select>`;
  const options = projects.map(p =>
    `<option value="${esc(p.project_id)}" ${selected === p.project_id ? 'selected' : ''}>${esc(p.slug)}</option>`
  ).join('');
  return `<select id="${opts.id||'projectSelector'}" style="padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;cursor:pointer;${opts.style||''}" onchange="${opts.onchange||''}">${options}</select>`;
}

loadDomainNav().finally(() => {
  buildSidebar();
  loadCurrentView();
  checkPulse();
  startPulsePolling();
});
</script>
