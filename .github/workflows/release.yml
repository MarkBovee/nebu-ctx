name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.2)"
        required: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CLIENT_MANIFEST_PATH: client/Cargo.toml
  CLIENT_BINARY_NAME: nebu-ctx

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_suffix: x86_64-unknown-linux-gnu
            archive_name: nebu-ctx-x86_64-unknown-linux-gnu.tar.gz
            container: rust:1.95-slim-bookworm
          - target: aarch64-unknown-linux-gnu
            artifact_suffix: aarch64-unknown-linux-gnu
            archive_name: nebu-ctx-aarch64-unknown-linux-gnu.tar.gz
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            artifact_suffix: x86_64-pc-windows-msvc
            archive_name: nebu-ctx-x86_64-pc-windows-msvc.zip
            runner: windows-latest
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps (Bookworm container)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.container == '' && matrix.runner != 'windows-latest'
        run: cargo install cross --locked

      - name: Build (native in Bookworm)
        if: matrix.container != ''
        run: cargo build --release --manifest-path ${{ env.CLIENT_MANIFEST_PATH }} --bin ${{ env.CLIENT_BINARY_NAME }} --target ${{ matrix.target }}

      - name: Build (native on Windows)
        if: matrix.runner == 'windows-latest'
        run: cargo build --release --manifest-path ${{ env.CLIENT_MANIFEST_PATH }} --bin ${{ env.CLIENT_BINARY_NAME }} --target ${{ matrix.target }}

      - name: Build (cross for arm64)
        if: matrix.container == '' && matrix.runner != 'windows-latest'
        run: cross build --release --manifest-path ${{ env.CLIENT_MANIFEST_PATH }} --bin ${{ env.CLIENT_BINARY_NAME }} --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p "package/${{ matrix.artifact_suffix }}"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              cp "client/target/${{ matrix.target }}/release/${{ env.CLIENT_BINARY_NAME }}.exe" "package/${{ matrix.artifact_suffix }}/"
              (cd "package/${{ matrix.artifact_suffix }}" && 7z a "../../${{ matrix.archive_name }}" "${{ env.CLIENT_BINARY_NAME }}.exe")
              ;;
            *)
              cp "client/target/${{ matrix.target }}/release/${{ env.CLIENT_BINARY_NAME }}" "package/${{ matrix.artifact_suffix }}/"
              tar -czf "${{ matrix.archive_name }}" -C "package/${{ matrix.artifact_suffix }}" "${{ env.CLIENT_BINARY_NAME }}"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_suffix }}
          path: ${{ matrix.archive_name }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/x86_64-unknown-linux-gnu/nebu-ctx-x86_64-unknown-linux-gnu.tar.gz
            artifacts/aarch64-unknown-linux-gnu/nebu-ctx-aarch64-unknown-linux-gnu.tar.gz
            artifacts/x86_64-pc-windows-msvc/nebu-ctx-x86_64-pc-windows-msvc.zip
          body: |
            Pre-built thin client binaries for nebu-ctx ${{ steps.version.outputs.tag }}

            These binaries connect to the .NET nebu-ctx server and dashboard runtime.

            | Target | Archive |
            |--------|---------|
            | x86_64-unknown-linux-gnu | `nebu-ctx-x86_64-unknown-linux-gnu.tar.gz` |
            | aarch64-unknown-linux-gnu | `nebu-ctx-aarch64-unknown-linux-gnu.tar.gz` |
            | x86_64-pc-windows-msvc | `nebu-ctx-x86_64-pc-windows-msvc.zip` |

  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path client/Cargo.toml

  publish-server-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/markbovee/nebu-ctx:${{ steps.version.outputs.version }}
            ghcr.io/markbovee/nebu-ctx:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=min,scope=server-image
