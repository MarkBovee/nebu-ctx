name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.2)"
        required: true
  workflow_run:
    workflows: ["Auto Release"]
    types: [completed]
    branches: [main]

env:
  CARGO_BUILD_JOBS: 2
  BINARY_NAME: nebula-ctx

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            container: rust:1.95-slim-bookworm
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Bookworm container)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.container == ''
        run: cargo install cross --locked

      - name: Build (native in Bookworm)
        if: matrix.container != ''
        run: cargo build --release --features cloud-server -p nebula-ctx

      - name: Build (cross for arm64)
        if: matrix.container == ''
        run: cross build --release --features cloud-server -p nebula-ctx --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-ctx-${{ matrix.arch }}
          path: ${{ matrix.container != '' && 'target/release/nebula-ctx' || format('target/{0}/release/nebula-ctx', matrix.target) }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION=$(grep '^version:' homeassistant/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries with arch suffix
        run: |
          mv artifacts/nebula-ctx-amd64/nebula-ctx artifacts/nebula-ctx-amd64/nebula-ctx-amd64
          mv artifacts/nebula-ctx-arm64/nebula-ctx artifacts/nebula-ctx-arm64/nebula-ctx-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/nebula-ctx-amd64/nebula-ctx-amd64
            artifacts/nebula-ctx-arm64/nebula-ctx-arm64
          body: |
            Pre-built binaries for nebula-ctx ${{ steps.version.outputs.tag }}

            | Arch | Binary |
            |------|--------|
            | amd64 | `nebula-ctx-amd64` |
            | arm64 | `nebula-ctx-arm64` |
