name: "nebu-ctx"
description: "Context engineering MCP server with ingress dashboard and HTTP MCP endpoint"
version: "0.2.5"
slug: "nebu_ctx"
url: "https://github.com/MarkBovee/nebu-ctx/tree/main/homeassistant"
stage: "experimental"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 3333
panel_icon: "mdi:graph-box"
panel_title: "nebu-ctx"
map:
  - config:rw
  - share:rw
ports:
  4242/tcp: 4242
ports_description:
  4242/tcp: "nebu-ctx MCP HTTP endpoint"
options:
  store: "sqlite"
  database_url: ""
  auth_token: ""
  postgres_host: "homeassistant"
  postgres_port: 5432
  postgres_database: "nebula_ctx"
  postgres_username: "postgres"
  postgres_password: ""
  log_level: "info"
  project_root: "/share"
schema:
  store: "list(sqlite|postgres)"
  database_url: "str?"
  auth_token: "password?"
  postgres_host: "str?"
  postgres_port: "port?"
  postgres_database: "str?"
  postgres_username: "str?"
  postgres_password: "password?"
  log_level: "list(debug|info|warn|error)"
  project_root: "str?"
