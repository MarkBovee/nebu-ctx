name: "nebula-ctx"
description: "Context engineering MCP server with ingress dashboard and optional HTTP MCP endpoint"
version: "0.1.1"
slug: "nebula_ctx"
url: "https://github.com/MarkBovee/nebula-ctx/tree/main/homeassistant"
stage: "experimental"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 3333
panel_icon: "mdi:graph-box"
panel_title: "nebula-ctx"
map:
  - config:rw
  - share:rw
ports:
  4242/tcp: 4242
ports_description:
  4242/tcp: "nebula-ctx MCP HTTP endpoint"
options:
  store: "sqlite"
  database_url: ""
  auth_token: ""
  log_level: "info"
  project_root: "/share"
schema:
  store: "list(sqlite|postgres)"
  database_url: "password?"
  auth_token: "password?"
  log_level: "list(debug|info|warn|error)"
  project_root: "str?"
