name: "Nebu-CTX Server"
description: "Context engineering MCP server with ingress dashboard and HTTP MCP endpoint"
version: "0.8.29"
slug: "nebu_ctx"
url: "https://github.com/MarkBovee/nebu-ctx/tree/main/homeassistant"
image: "ghcr.io/markbovee/nebu-ctx"
stage: "experimental"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 3333
panel_icon: "mdi:creation"
panel_title: "Nebu-CTX"
map:
  - config:rw
  - share:rw
ports:
  4242/tcp: 4242
ports_description:
  4242/tcp: "Nebu-CTX MCP HTTP endpoint"
options:
  postgres_host: "homeassistant"
  postgres_port: 5432
  postgres_database: "nebula_ctx"
  postgres_username: "postgres"
  postgres_password: ""
  log_level: "info"
  project_root: "/share"
schema:
  postgres_host: "str?"
  postgres_port: "port?"
  postgres_database: "str?"
  postgres_username: "str?"
  postgres_password: "password?"
  log_level: "list(debug|info|warn|error)"
  project_root: "str?"
