name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --manifest-path client/Cargo.toml

      - name: Run clippy
        continue-on-error: true
        run: cargo clippy --manifest-path client/Cargo.toml --all-targets

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build server/NebuCtx.slnx -p:AllowMissingPrunePackageData=true

      - name: Run tests
        run: dotnet test server/NebuCtx.slnx -p:AllowMissingPrunePackageData=true
